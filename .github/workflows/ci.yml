name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: schadendirekt
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d schadendirekt"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/schadendirekt?schema=public
      WORKER_TOKEN: ci-worker-token
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify dependency audit
        run: npm audit --audit-level=moderate

      - name: Validate Prisma schema
        run: npm run db:validate

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Apply database migrations
        run: npm run db:migrate

      - name: Verify migration state
        run: npx prisma migrate status

      - name: Run tests
        run: npm test

      - name: Type-check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

  browser:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: schadendirekt_e2e
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U postgres -d schadendirekt_e2e"
          --health-interval=5s --health-timeout=5s --health-retries=10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s --health-timeout=5s --health-retries=10
    # Disposable local CI credentials; no staging credentials or real data.
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/schadendirekt_e2e?schema=public
      WORKER_TOKEN: ci-isolated-worker-token
      RATE_LIMIT_STORE: redis-tcp
      REDIS_URL: redis://127.0.0.1:6379
      IMPORT_STORAGE_DRIVER: s3
      IMPORT_STORAGE_S3_ENDPOINT: http://127.0.0.1:9000
      IMPORT_STORAGE_S3_REGION: us-east-1
      IMPORT_STORAGE_S3_BUCKET: browser-imports
      IMPORT_STORAGE_S3_ACCESS_KEY_ID: ci-minio-user
      IMPORT_STORAGE_S3_SECRET_ACCESS_KEY: ci-isolated-minio-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Start isolated S3-compatible storage
        run: |
          docker run -d --name e2e-minio -p 127.0.0.1:9000:9000 \
            -e MINIO_ROOT_USER="$IMPORT_STORAGE_S3_ACCESS_KEY_ID" \
            -e MINIO_ROOT_PASSWORD="$IMPORT_STORAGE_S3_SECRET_ACCESS_KEY" \
            minio/minio:RELEASE.2025-09-07T16-13-09Z server /data
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:9000/minio/health/ready; then break; fi
            sleep 1
          done
          curl --fail http://127.0.0.1:9000/minio/health/ready
          docker run --rm --network host --entrypoint /bin/sh \
            -e IMPORT_STORAGE_S3_ACCESS_KEY_ID -e IMPORT_STORAGE_S3_SECRET_ACCESS_KEY \
            minio/mc:RELEASE.2025-08-13T08-35-41Z -c \
            'mc alias set e2e http://127.0.0.1:9000 "$IMPORT_STORAGE_S3_ACCESS_KEY_ID" "$IMPORT_STORAGE_S3_SECRET_ACCESS_KEY" && mc mb e2e/browser-imports'
      - name: Validate Prisma and migrate fresh browser database
        run: |
          npm run db:validate
          npm run db:generate
          npm run db:migrate
          npx prisma migrate status
      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium
      - name: Build production application
        run: npm run build
      - name: Run browser and import-worker smoke tests
        run: npm run test:browser
      - name: Upload browser results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-results
          path: |
            playwright-report/
            test-results/
          retention-days: 7
      - name: Stop isolated object storage
        if: always()
        run: docker rm -f e2e-minio
