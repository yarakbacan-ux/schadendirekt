name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: schadendirekt
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d schadendirekt"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/schadendirekt?schema=public
      WORKER_TOKEN: ci-worker-token
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Remediate dependency vulnerabilities
        run: npm audit fix --force

      - name: Verify dependency audit
        run: npm audit --audit-level=moderate

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Apply database migrations
        run: npm run db:migrate

      - name: Run tests
        run: npm test

      - name: Type-check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Commit remediated dependency files
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "No dependency changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore: remediate npm dependency vulnerabilities"
          git push
